bundle = "com\\.google\\.Chrome|com\\.apple\\.Safari|com\\.brave\\.Browser|com\\.microsoft\\.edgemac|company\\.thebrowser\\.Browser|org\\.mozilla\\.firefox|com\\.vivaldi\\.Vivaldi|org\\.chromium"

[[rule]]
