[[rule]]
category = "paper_writing"
bundle = "com\\.microsoft\\.Word|com\\.apple\\.iWork\\.Pages|md\\.obsidian|com\\.openai\\.chat|com\\.google\\.GeminiMacOS"

# --- social / video ---------------------------------------------------------
[[rule]]
