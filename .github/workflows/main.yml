name: scitime CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run tests
        run: |
          "$HOME/.local/bin/uv" sync
          "$HOME/.local/bin/uv" run pytest -q
          "$HOME/.local/bin/uv" run scitime --help > /dev/null
