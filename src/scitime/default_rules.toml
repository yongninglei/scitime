bundle = "com\\.apple\\.Terminal|com\\.googlecode\\.iterm2|com\\.mitchellh\\.ghostty|com\\.github\\.wez\\.wezterm|dev\\.warp\\.|net\\.kovidgoyal\\.kitty|io\\.alacritty"

# --- alerts and daily email ---------------------------------------------------
[digest]
time = "21:00"   # when the daily summary is sent (by the launch agent)
email = ""       # your address; empty = only a macOS notification, no email
# The email is sent through the Mail app with your normal account.

# min_hours: warn in the evening digest if the day ends below this.
# max_hours: macOS notification as soon as the day goes over, plus a line in the digest.
[[alert]]
name = "Writing"
categories = ["paper_writing"]
min_hours = 4

[[alert]]
name = "Browsing + social"
categories = ["browsing", "social"]
max_hours = 1.5
